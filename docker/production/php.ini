; Production PHP overrides — safe defaults only, no secrets, no environment-
; specific values. Pair with APP_DEBUG=false (enforced via docs/DEPLOYMENT_CHECKLIST.md,
; not here — this file can't read .env).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Laravel logs its own errors via the exception handler; PHP-level error_log
; still goes to stderr so container log collectors pick it up.
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Bounded, sane defaults — tune to real traffic/certificate-PDF sizes once
; measured; not a guess at your actual production load.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 60
