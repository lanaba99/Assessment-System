# Standard Laravel PHP-FPM vhost. TLS is NOT terminated here on purpose —
# this container sits behind whatever load balancer/ingress terminates HTTPS
# in the real deployment (see docs/PRODUCTION_OPERATIONS.md); duplicating TLS
# termination here would mean guessing at certificates/domains that belong to
# the hosting provider, not this repository.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # storage/ and bootstrap/cache are never web-served directly — only
    # public/storage (the symlink target) is, matching config/filesystems.php.
    location ~ ^/(storage|bootstrap/cache)/ {
        deny all;
    }
}
