# Production-oriented compose baseline — separate from compose.yaml (Sail's
# dev stack, unchanged, still bind-mounts source and stays exactly as it was).
# This file is NEW and does not affect local development at all.
#
# What this deliberately does NOT do, because it would mean guessing at a
# specific hosting provider (see docs/DEPLOYMENT_CHECKLIST.md for the real
# checklist these map to):
#   - terminate TLS (a real load balancer/ingress does that in front of nginx)
#   - set real resource limits (depends on actual measured traffic)
#   - inject real secrets (use your platform's secrets manager; docker-compose
#     `env_file:`/`environment:` here only reference variable NAMES)
#   - provision managed MySQL/Redis (the app/worker/scheduler services below
#     just need DB_HOST/REDIS_HOST pointed at wherever those actually run —
#     the mysql/redis services below are an optional self-hosted fallback,
#     commented for that reason, not the recommended production path)
#
# Known limitation of the nginx<->app asset-sharing approach below: the
# `public_assets` named volume is seeded from the app image's public/ dir
# only the FIRST time it's created. On a redeploy with new frontend-served
# assets, that volume needs to be recreated (or replaced with a real
# CI-pushed static-asset step / CDN) — documented here rather than solved,
# since the "right" answer depends on the hosting provider's deploy pipeline.

services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
    expose:
      - "9000"

  worker:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    # Every queue name this app actually uses (grading, psychometrics,
    # penalties, analytics) — see compose.yaml's laravel.worker for the same
    # fix applied to the dev stack.
    command: php artisan queue:work --queue=grading,psychometrics,penalties,analytics --tries=3 --backoff=5

  scheduler:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    # No business-scheduled tasks exist beyond Laravel's own queue:prune-failed
    # (routes/console.php) as of this baseline — schedule:work just means the
    # mechanism is running and ready the moment a real task is added.
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  # Optional self-hosted fallback ONLY — a real production deployment should
  # prefer a managed MySQL (RDS/Cloud SQL/etc.) instead. Uncomment only if
  # you specifically intend to run MySQL in this same compose stack, and
  # replace every "changeme" below with real secrets injected by your
  # platform, never committed here.
  # mysql:
  #   image: mysql:8.4
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: "${DB_DATABASE}"
  #     MYSQL_USER: "${DB_USERNAME}"
  #     MYSQL_PASSWORD: "${DB_PASSWORD}"
  #     MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
  #   volumes:
  #     - redis_data:/data

volumes:
  app_storage:
  public_assets:
  # mysql_data:
  # redis_data:
